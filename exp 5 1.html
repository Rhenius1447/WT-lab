<!DOCTYPE html>
<html>
<head>
    <title>Shortest and Longest Word - URK24CS1156 </title>
</head>
<body>
<h2>Find Shortest and Longest Word - URK24CS1156 </h2>
<button onclick="findWords()">Find</button>
<p id="result"></p>
<script>
function findWords() {
    var str = "Web technology lab";
    var words = str.split(" ");
   var shortest = words[0];
    var longest = words[0];
    for (var i = 0; i < words.length; i++) {
        if (words[i].length < shortest.length) {
            shortest = words[i];
        }
        if (words[i].length > longest.length) {
            longest = words[i];
        }
    }
    document.getElementById("result").innerHTML =
        "Shortest: " + shortest + "<br>" +
        "Longest: " + longest;
}
</script>
</body>
</html>
