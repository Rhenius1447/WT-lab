<!DOCTYPE html>
<html>
<head>
<title>Budget Calculator</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.mixxxx`n.js"></script>
<style>
body{text-align:center;font-family:Arial}
h3{background:#000;color:white;padding:8px}
.box{display:inline-block;color:white;padding:12px;margin:5px}
</style>
<script>
$(function(){
 $("#btn").click(function(){
  let a=+$("#amt").val(),r=+$("#r").val(),ac=+$("#ac").val(),
  e=+$("#e").val(),s=+$("#s").val();
  if(r+ac+e+s!=100){alert("Percentage must be 100%");return;}
  $("#room").html("Room Rent<br>Rs."+(a*r/100));
  $("#access").html("Accessories<br>Rs."+(a*ac/100));
  $("#emer").html("Emergency<br>Rs."+(a*e/100));
  $("#save").html("Saving<br>Rs."+(a*s/100));
 });
});
</script>
</head>
<body>
<h3>Budget Calculator App</h3>
Enter Amount: <input id="amt" value="15000"><br><br>
Room Rent(%): <input id="r" value="50">
Accessories(%): <input id="ac" value="20">
Emergency(%): <input id="e" value="20">
Saving(%): <input id="s" value="10"><br><br>
<button id="btn">Evaluate My Money</button><br><br>
<div id="room" class="box" style="background:blue"></div>
<div id="access" class="box" style="background:green"></div>
<div id="emer" class="box" style="background:navy"></div>
<div id="save" class="box" style="background:pink"></div>
</body>
</html>
