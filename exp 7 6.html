<!DOCTYPE html>
<html>
<head>
    <title>Employee Management - URK24CS1156</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #eaf2ff;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: 75px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px #9aa9bd;
        }

        input {
            width: 90px;
            padding: 6px;
            margin: 3px;
            border: 1px solid #9bb7d4;
            border-radius: 3px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 10px;
            margin: 4px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            margin-top: 12px;
            border-collapse: collapse;
        }

        th {
            background: #1e40af;
            color: white;
        }

        th, td {
            padding: 8px;
            border: 1px solid #cbd5e1;
        }

        .selected {
            background: #dbeafe;
        }
    </style>
</head>

<body>

<div class="container">

    <h3>5. Employee Management Dashboard - URK24CS1156</h3>

    <input type="text" id="id" placeholder="Employee ID">
    <input type="text" id="name" placeholder="Employee Name">
    <input type="text" id="dept" placeholder="Department">

    <br>

    <button id="add">Add Employee</button>
    <button id="update">Update</button>
    <button id="remove">Remove</button>
    <button id="dimension">Show Table Dimensions</button>

    <table id="employees">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Riya</td>
            <td>HR</td>
            <td><button class="select">Select</button></td>
        </tr>

        <tr>
            <td>102</td>
            <td>Arjun</td>
            <td>IT</td>
            <td><button class="select">Select</button></td>
        </tr>

        <tr>
            <td>103</td>
            <td>Meera</td>
            <td>Finance</td>
            <td><button class="select">Select</button></td>
        </tr>

    </table>

</div>

<script>
$(document).ready(function() {

    let selectedRow = null;

    $(".select").click(function() {

        $(".selected").removeClass("selected");

        selectedRow = $(this).closest("tr");

        selectedRow.addClass("selected");

        $("#id").val(selectedRow.children().eq(0).text());
        $("#name").val(selectedRow.children().eq(1).text());
        $("#dept").val(selectedRow.children().eq(2).text());
    });

    $("#add").click(function() {

        let id = $("#id").val();
        let name = $("#name").val();
        let dept = $("#dept").val();

        if (id && name && dept) {

            $("#employees").append(
                "<tr>" +
                "<td>" + id + "</td>" +
                "<td>" + name + "</td>" +
                "<td>" + dept + "</td>" +
                "<td><button class='select'>Select</button></td>" +
                "</tr>"
            );

            $("#id,#name,#dept").val("");
        }
    });

    $("#update").click(function() {

        if (selectedRow) {

            selectedRow.children().eq(0).text($("#id").val());
            selectedRow.children().eq(1).text($("#name").val());
            selectedRow.children().eq(2).text($("#dept").val());
        }
    });

    $("#remove").click(function() {

        if (selectedRow) {

            selectedRow.remove();
            selectedRow = null;

            $("#id,#name,#dept").val("");
        }
    });

    $("#dimension").click(function() {

        let rows = $("#employees tr").length - 1;
        let cols = $("#employees th").length;

        alert("Rows: " + rows + "\nColumns: " + cols);
    });

    $("#employees").dblclick(function() {

        $(this).css({
            "background": "#fff7ed",
            "border": "3px solid #2563eb"
        });
    });

});
</script>

</body>
</html>
